server:
  websocket_addr: ":8080"
  admin_addr: ":8081"
  read_timeout: "30s"
  write_timeout: "30s"
  max_connections: 200
  internal_token: "dev-internal-token"
aisaas:
  base_url: "http://127.0.0.1:8190"
  internal_token: "dev-internal-token"
  http_timeout: "30s"
vad:
  model_path: "./models/silero_vad.onnx"
  speech_threshold: 0.5
  silence_threshold: 0.3
  silence_duration_ms: 800
  frame_size_samples: 512
opus:
  uplink:
    sample_rate: 16000
    channels: 1
    frame_duration_ms: 60
  downlink:
    sample_rate: 24000
    channels: 1
    frame_duration_ms: 60
dialogue:
  per_turn_timeout: 30
  window_memory_size: 20
  ttfs_alert_threshold_ms: 3000
database:
  dsn: "root:Azyj1234@tcp(127.0.0.1:3306)/xiaozhi?charset=utf8mb4&parseTime=true&loc=Local"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: "30m"
  migration_path: "./migrations"
logging:
  level: debug
  format: json
  output: stdout